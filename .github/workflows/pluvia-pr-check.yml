name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [Legacy, Modern]
    runs-on: ubuntu-latest
    name: build (${{ matrix.variant }})

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create local.properties
        run: touch local.properties
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests (${{ matrix.variant }})
        timeout-minutes: 45
        run: |
          : > gradle.log
          tail -n +1 -F gradle.log &
          tail_pid=$!
          ./gradlew :app:test${{ matrix.variant }}DebugUnitTest > gradle.log 2>&1 &
          gradle_pid=$!
          last_size=0
          stalled_for=0
          while kill -0 "$gradle_pid" 2>/dev/null; do
            sleep 15
            size=$(stat -c %s gradle.log)
            if [ "$size" -eq "$last_size" ]; then
              stalled_for=$((stalled_for + 15))
            else
              stalled_for=0
              last_size=$size
            fi
            if [ "$stalled_for" -ge 600 ]; then
              echo "::error::No Gradle output for 10 minutes, dumping test JVM threads"
              for pid in $(pgrep -f 'Gradle Test Executor'); do
                echo "===== jstack $pid ====="
                jstack "$pid" || true
              done
              pkill -f 'Gradle Test Executor' || true
              kill "$gradle_pid" || true
              sleep 2
              kill "$tail_pid" || true
              exit 1
            fi
          done
          wait "$gradle_pid"
          status=$?
          sleep 2
          kill "$tail_pid" || true
          exit $status
